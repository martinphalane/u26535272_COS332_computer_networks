<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <!-- Disable caching -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">

    <!-- Redirect after 5 seconds -->
    <meta http-equiv="refresh" content="5; URL=http://localhost/cgi-bin/RandomLinks.cgi">

    <title>Game Starting...</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 20vh;
        }

        .countdown {
            font-size: 4rem;
            font-weight: bold;
        }

        .countdown span {
            position: absolute;
            opacity: 0;
            animation: show 5s linear forwards;
        }

        .countdown span:nth-child(1) { animation-delay: 0s; }
        .countdown span:nth-child(2) { animation-delay: 1s; }
        .countdown span:nth-child(3) { animation-delay: 2s; }
        .countdown span:nth-child(4) { animation-delay: 3s; }
        .countdown span:nth-child(5) { animation-delay: 4s; }

        @keyframes show {
            0%   { opacity: 1; }
            19%  { opacity: 1; }
            20%  { opacity: 0; }
            100% { opacity: 0; }
        }
    </style>
</head>
<body>

    <h1>Game is about to start!</h1>

    <div class="countdown">
        <span>5</span>
        <span>4</span>
        <span>3</span>
        <span>2</span>
        <span>1</span>
    </div>

    <p>If not redirected,
        <a href="http://localhost/cgi-bin/RandomLinks.cgi">click here</a>
    </p>

</body>
</html>
